plugins { id 'com.android.application' }

def mapsApiKey = System.getenv('MAPS_API_KEY') ?: (project.findProperty('MAPS_API_KEY') ?: '')
def escapedKey = mapsApiKey.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.mdiaz.trxlauncher'
    compileSdk 36
    defaultConfig {
        applicationId 'com.mdiaz.trxlauncher'
        minSdk 26
        targetSdk 36
        versionCode 600
        versionName '6.0.0'
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
        buildConfigField 'String', 'MAPS_API_KEY', "\"${escapedKey}\""
    }
    buildFeatures { buildConfig true }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            def ksPath = System.getenv('KEYSTORE_PATH')
            if (ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
}

dependencies {
    implementation 'com.google.android.libraries.navigation:navigation:7.9.0'
    implementation('com.google.android.libraries.places:places:4.3.1') {
        exclude group: 'com.google.android.gms', module: 'play-services-maps'
    }
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}
