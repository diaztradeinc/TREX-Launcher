name: Build Clean TRX Launcher
on:
  workflow_dispatch:
  push:
    branches: ["main", "master", "clean-v5"]
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - name: Verify key
        env: { MAPS_API_KEY: "${{ secrets.MAPS_API_KEY }}" }
        run: test -n "$MAPS_API_KEY"
      - name: Decode signing keystore
        env: { KEYSTORE_BASE64: "${{ secrets.KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $HOME/trx-release.keystore
            echo "KEYSTORE_PATH=$HOME/trx-release.keystore" >> $GITHUB_ENV
            keytool -list -keystore $HOME/trx-release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" 2>&1 || true
          fi
      - name: Build
        env:
          MAPS_API_KEY: "${{ secrets.MAPS_API_KEY }}"
          KEYSTORE_PATH: "${{ env.KEYSTORE_PATH }}"
          KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
        run: gradle --no-daemon :app:assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk TRX-Launcher-v6.0.0.apk
      - name: Print signing certificate SHA-1
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs --verbose TRX-Launcher-v6.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TRX-Launcher-v6.0.0
          path: TRX-Launcher-v6.0.0.apk
          retention-days: 30
